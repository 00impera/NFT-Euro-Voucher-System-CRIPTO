<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Euro Voucher System - Monad Blockchain</title>
  <!-- Tailwind CDN (OK for demos/GitHub Pages) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- thirdweb CDN -->
  <script src="https://unpkg.com/thirdweb@latest/dist/thirdweb.umd.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    body { font-family: 'JetBrains Mono', monospace; background: #000; }
    .neon-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
    .neon-glow-strong { box-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
    .voucher-btn {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(147, 197, 253, 0.2) 100%);
      border: 2px solid rgba(59, 130, 246, 0.5);
      transition: all 0.3s ease;
    }
    .voucher-btn:hover {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(147, 197, 253, 0.3) 100%);
      border-color: rgba(59, 130, 246, 0.8);
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
    }
    .voucher-btn.selected {
      background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
      border-color: #93c5fd;
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.9);
      transform: scale(1.05);
    }
    .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-black text-blue-400 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <!-- ... your HTML content ... -->

    <!-- Purchase Button -->
    <button id="purchaseBtn" disabled
      class="w-full bg-blue-500 hover:bg-blue-400 disabled:bg-gray-700 disabled:text-gray-500 text-black font-bold py-4 px-6 rounded-xl transition-all disabled:cursor-not-allowed flex items-center justify-center gap-2 mb-6 neon-glow hover:neon-glow-strong tracking-wider">
      SELECT VOUCHER
    </button>

    <!-- Status Message -->
    <div id="statusMessage" class="hidden bg-blue-950/30 border-2 border-blue-400 rounded-xl p-4 mb-6 neon-glow">
      <p class="text-blue-400" id="statusText"></p>
    </div>

    <!-- Read Voucher Section -->
    <div class="bg-black border-2 border-blue-500 rounded-2xl p-6 mb-6 neon-glow">
      <h2 class="text-xl font-bold text-blue-400 mb-4 flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
        </svg>
        [READ VOUCHER BY TOKEN ID]
      </h2>
      <div class="flex gap-2 mb-4">
        <input type="number" id="readTokenId" placeholder="Enter tokenId"
          class="w-32 px-4 py-2 bg-black border-2 border-blue-500/50 rounded-lg text-blue-400 placeholder-blue-600 focus:outline-none focus:border-blue-400"/>
        <button id="readVoucherBtn"
          class="bg-blue-500 hover:bg-blue-400 text-black font-bold py-2 px-4 rounded-xl transition-all neon-glow hover:neon-glow-strong">
          Read Voucher
        </button>
      </div>
      <div id="voucherResult" class="text-blue-300 text-sm"></div>
    </div>
  </div>

  <!-- All your JS goes here, after thirdweb CDN is loaded -->
  <script>
    // --- CONFIGURATION ---
    const CONTRACT_ADDRESS = "0xE52a449392Eb46Fe82845b94aD221cF9BEDedc45";
    const CHAIN_ID = 143;
    const CONTRACT_ABI = [
      {
        "inputs": [
          {"internalType": "uint256", "name": "euroValue", "type": "uint256"},
          {"internalType": "string", "name": "voucherId", "type": "string"}
        ],
        "name": "purchaseVoucher",
        "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
        "stateMutability": "payable",
        "type": "function"
      },
      {
        "inputs": [{"internalType": "uint256", "name": "tokenId", "type": "uint256"}],
        "name": "getVoucher",
        "outputs": [
          {"internalType": "uint256", "name": "euroValue", "type": "uint256"},
          {"internalType": "uint256", "name": "pricePaidMON", "type": "uint256"},
          {"internalType": "address", "name": "buyer", "type": "address"},
          {"internalType": "uint256", "name": "purchaseTimestamp", "type": "uint256"},
          {"internalType": "bool", "name": "redeemed", "type": "bool"},
          {"internalType": "string", "name": "voucherId", "type": "string"}
        ],
        "stateMutability": "view",
        "type": "function"
      }
    ];

    // --- THIRDWEB SETUP ---
  const client = thirdweb.createThirdwebClient({
  clientId:
    "P5kPPxAUFvYIM_NFI1UQwpnuDxknnF_v2FQ1vIdt9hKAiIuDcYYKWyz3uzxP63wGjyAuM5nD0JNca3d2OMyAXQ",
});

    const monadChain = thirdweb.defineChain(CHAIN_ID);

    // --- READ VOUCHER LOGIC ---
    const readTokenId = document.getElementById('readTokenId');
    const readVoucherBtn = document.getElementById('readVoucherBtn');
    const voucherResult = document.getElementById('voucherResult');

    readVoucherBtn.addEventListener('click', async () => {
      const tokenId = readTokenId.value;
      voucherResult.textContent = '';
      if (!tokenId || isNaN(tokenId)) {
        voucherResult.textContent = 'Please enter a valid tokenId.';
        return;
      }
      try {
        const contract = await thirdweb.getContract({
          client,
          address: CONTRACT_ADDRESS,
          chain: monadChain,
          abi: CONTRACT_ABI,
        });
        const result = await thirdweb.readContract({
          contract,
          method: "function getVoucher(uint256 tokenId)",
          params: [tokenId],
        });
        voucherResult.innerHTML = `
          <div><b>euroValue:</b> ${result[0]}</div>
          <div><b>pricePaidMON:</b> ${result[1]}</div>
          <div><b>buyer:</b> ${result[2]}</div>
          <div><b>purchaseTimestamp:</b> ${result[3]}</div>
          <div><b>redeemed:</b> ${result[4]}</div>
          <div><b>voucherId:</b> ${result[5]}</div>
        `;
      } catch (err) {
        voucherResult.textContent = 'Error reading voucher: ' + (err.message || err);
      }
    });
  </script>
</body>
</html>
